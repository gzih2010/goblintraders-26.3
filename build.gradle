plugins {
     id 'fabric-loom' version '2.0.0'
     id 'maven-publish'
 }
 version = project.mod_version
 group = project.maven_group
 repositories {
     maven { url "https://maven.fabricmc.net/" }
     maven { url "https://maven.mrcrayfish.com/" }
     mavenCentral()
 }
 dependencies {
     minecraft "com.mojang:minecraft:${project.minecraft_version}"
     mappings "net.fabricmc:yarn:${project.yarn_mappings}"
     modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
     modImplementation "net.fabricmc.fabric-api:${project.fabric_api_version}"
     modImplementation "com.mrcrayfish.framework:framework-fabric:${project.framework_version}"
 }
 loom {
     accessWidenerPath = file("src/main/resources/goblintraders.accesswidener")
 }
 tasks.processResources {
     inputs.property "version", project.version
     inputs.property "minecraft_version", project.minecraft_version
     inputs.property "fabric_api_version", project.fabric_api_version
     inputs.property "loader_version", loader_version
     filesMatching("fabric.mod.json") {
         expand "version": project.version,
                 "minecraft_version": project.minecraft_version,
                 "fabric_api_version": project.fabric_api_version,
                 "loader_version": loader_version
     }
 }
 tasks.jar {
     archiveBaseName = "goblintraders"
     from("LICENSE") {
         rename { "${it}_${archiveBaseName.get()}" }
     }
 }
 publishing {
     publications {
         mavenJava(MavenPublication) {
             artifactId = "goblintraders"
             from components.java
         }
     }
     repositories {
         mavenLocal()
     }
 }